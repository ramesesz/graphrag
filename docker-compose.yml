services:
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./services/neo4j/data:/data
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*

  processor:
    build: ./services/processor
    container_name: graph-processor
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - neo4j

  jupyter:
    build: ./services/processor # Mirrors the processor container
    container_name: rag-notebook
    ports:
      - "8888:8888"
    env_file:
      - ./.env
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./configs:/app/configs
    command: jupyter notebook --ip 0.0.0.0 --port 8888 --no-browser --allow-root --notebook-dir=/app --NotebookApp.token='' --NotebookApp.password=''
    depends_on:
      - neo4j

  frontend:
    build: ./services/frontend
    container_name: frontend
    ports:
      - "8501:8501"
    env_file:
      - ./.env
    environment:
      - PROCESSOR_API_URL=http://processor:8000
    depends_on:
      - neo4j
      - processor
    volumes:
      - ./services/frontend:/app
      - ./configs:/app/configs
      - ./services/processor:/app/processor
